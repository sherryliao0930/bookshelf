<!-- ============ 書架 ============ -->
<div id="shelfView">
  <header class="topbar">
    <h1 id="shelfTitle"><svg class="mascot mascot-title" viewBox="0 0 120 124"><use href="#a-owl"/></svg><span>我的電子書櫃</span></h1>
    <div class="topbar-actions">
      <div class="search-wrap">
        <svg class="ic search-icon"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="找一本書…" autocomplete="off">
      </div>
    </div>
  </header>

  <main id="shelfMain">
    <div id="statusBox" class="status-box" hidden></div>
    <div id="adminBar" class="admin-bar" hidden>
      <svg class="ic"><use href="#i-drag"/></svg>
      <span>管理模式：可以<b>拖曳書本</b>調整順序，書封上的按鈕可以<b>改書名／換封面</b>或<b>刪除</b>。</span>
      <button type="button" class="btn btn-small" id="exitAdmin">離開管理模式</button>
    </div>

    <nav id="filterBar" class="filter-bar" hidden aria-label="分類"></nav>

    <div class="bookcase">
      <div class="bookcase-top">
        <div class="decor mascot-top" aria-hidden="true">
          <svg class="mascot" viewBox="0 0 120 124"><use href="#a-panda"/></svg>
        </div>
        <div class="decor mascot-top2" aria-hidden="true">
          <svg class="mascot" viewBox="0 0 120 124"><use href="#a-penguin"/></svg>
        </div>
      </div>

      <div class="bookcase-body">
        <div id="shelfRows"></div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-pair" aria-hidden="true">
            <svg class="mascot empty-a" viewBox="0 0 120 124"><use href="#a-rabbit"/></svg>
            <svg class="mascot empty-a" viewBox="0 0 120 124"><use href="#a-owl"/></svg>
            <svg class="mascot empty-a" viewBox="0 0 120 124"><use href="#a-bird"/></svg>
          </div>
          <p class="empty-title">書櫃還是空的</p>
          <p class="empty-sub">點右下角的齒輪就能上傳新書，<br>選一個 PDF 檔，它就會變成書櫃上的一本書。</p>
        </div>
      </div>

      <div class="bookcase-base"></div>
    </div>
  </main>

  <footer class="shelf-footer">
    <span id="bookCount"></span>
  </footer>

  <!-- 管理入口：平常縮在右下角，解鎖後才變成明顯的「上傳新書」 -->
  <button id="uploadBtn" class="fab" title="管理（上傳新書）" aria-label="管理（上傳新書）">
    <svg class="ic"><use href="#i-gear"/></svg><span>上傳新書</span>
  </button>
</div>

<!-- ============ 上傳對話框 ============ -->
<div id="uploadModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2><svg class="ic"><use href="#i-plus"/></svg>上傳新書</h2>
      <button class="icon-btn ghost" data-close-upload aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>

    <form id="uploadForm" class="modal-body">
      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-pen"/></svg>書名 <em>必填</em></span>
        <input id="fTitle" type="text" required maxlength="120" placeholder="例如：小王子">
      </label>

      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-pen"/></svg>作者／說明 <em>選填</em></span>
        <input id="fAuthor" type="text" maxlength="120" placeholder="例如：聖修伯里">
      </label>

      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-tag"/></svg>分類</span>
        <select id="fCategory" class="select"></select>
      </label>

      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-file"/></svg>PDF 檔案 <em>必填</em></span>
        <input id="fPdf" type="file" accept="application/pdf,.pdf" multiple required>
        <span class="hint" id="pdfHint">可以一次選多個檔案，會自動一本一本上架。單一檔案建議 50 MB 以內</span>
      </label>

      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-image"/></svg>封面圖片 <em>選填</em></span>
        <input id="fCover" type="file" accept="image/*">
        <span class="hint">不上傳的話，系統會自動抓 PDF 第一頁當封面。</span>
      </label>

      <div class="cover-preview-wrap" id="coverPreviewWrap">
        <div class="cover-preview" id="coverPreview"><span>封面預覽</span></div>
      </div>

      <div id="fileList" class="file-list" hidden></div>

      <div id="uploadProgress" class="progress" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">準備中…</span>
      </div>

      <p id="uploadError" class="form-error" hidden></p>

      <div class="modal-foot">
        <button type="button" class="btn" data-close-upload>取消</button>
        <button type="submit" class="btn btn-primary" id="submitUpload">開始上傳</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 編輯書籍對話框 ============ -->

  <div class="modal-card">
    <div class="modal-head">
      <h2><svg class="ic"><use href="#i-edit"/></svg>編輯書籍</h2>
      <button class="icon-btn ghost" data-close-edit aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>

    <form id="editForm" class="modal-body">
      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-pen"/></svg>書名</span>
        <input id="eTitle" type="text" required maxlength="120">
      </label>

      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-pen"/></svg>作者／說明 <em>選填</em></span>
        <input id="eAuthor" type="text" maxlength="120">
      </label>

      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-tag"/></svg>分類</span>
        <select id="eCategory" class="select"></select>
      </label>

      <label class="field">
        <span class="field-label"><svg class="ic"><use href="#i-image"/></svg>更換封面 <em>選填，JPG／PNG 都可以</em></span>
        <input id="eCover" type="file" accept="image/*">
        <span class="hint">不選就沿用原本的封面。選了就會換掉，舊封面會一併刪除。</span>
      </label>

      <div class="cover-preview-wrap">
        <div class="cover-preview" id="eCoverPreview"><span>封面預覽</span></div>
      </div>

      <div id="editProgress" class="progress" hidden>
        <div class="progress-bar"><div class="progress-fill" id="eProgressFill"></div></div>
        <span class="progress-text" id="eProgressText">儲存中…</span>
      </div>

      <p id="editError" class="form-error" hidden></p>

      <div class="modal-foot">
        <button type="button" class="btn" data-close-edit>取消</button>
        <button type="submit" class="btn btn-primary" id="submitEdit">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 管理密碼對話框 ============ -->
<div id="pwModal" class="modal" hidden>
  <div class="modal-card modal-narrow">
    <div class="modal-head">
      <h2><svg class="ic"><use href="#i-lock"/></svg>請輸入管理密碼</h2>
      <button class="icon-btn ghost" data-close-pw aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <form id="pwForm" class="modal-body">
      <p class="pw-note" id="pwNote">上傳與刪除需要管理密碼，瀏覽則不需要。</p>
      <label class="field">
        <input id="fPassword" type="password" autocomplete="current-password" placeholder="管理密碼">
      </label>
      <p id="pwError" class="form-error" hidden>密碼不對，再試一次。</p>
      <div class="modal-foot">
        <button type="button" class="btn" data-close-pw>取消</button>
        <button type="submit" class="btn btn-primary">確認</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 閱讀器 ============ -->
<div id="readerView" hidden>
  <header class="reader-bar">
    <div class="reader-top">
      <button id="closeReader" class="icon-btn" title="回書櫃 (Esc)" aria-label="回書櫃">
        <svg class="ic"><use href="#i-close"/></svg>
      </button>
      <span id="readerTitle" class="reader-title"></span>
    </div>

    <div class="reader-controls">
      <div class="ctrl-group">
        <button id="prevPage" class="icon-btn" title="上一頁 (←)" aria-label="上一頁"><svg class="ic"><use href="#i-prev"/></svg></button>
        <div class="page-jump">
          <input id="pageInput" type="text" inputmode="numeric" value="1" aria-label="跳到第幾頁">
          <span class="page-total">/ <b id="pageTotal">–</b></span>
        </div>
        <button id="nextPage" class="icon-btn" title="下一頁 (→)" aria-label="下一頁"><svg class="ic"><use href="#i-next"/></svg></button>
      </div>

      <div class="ctrl-group">
        <button id="zoomOut" class="icon-btn" title="縮小 (−)" aria-label="縮小"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
        <button id="zoomLevel" class="zoom-level" title="點一下切換：整頁 / 符合寬度 / 100%">整頁</button>
        <button id="zoomIn" class="icon-btn" title="放大 (+)" aria-label="放大"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
        <button id="fullscreenBtn" class="icon-btn" title="全螢幕 (F)" aria-label="全螢幕"><svg class="ic"><use href="#i-expand"/></svg></button>
      </div>
    </div>
  </header>

  <div id="pageHost" class="page-host">
    <div id="canvasWrap" class="canvas-wrap">
      <canvas id="pdfCanvas"></canvas>
      <div id="renderSpinner" class="spinner" hidden></div>
    </div>
    <button class="edge-nav edge-prev" id="edgePrev" aria-label="上一頁"><svg class="ic"><use href="#i-prev"/></svg></button>
    <button class="edge-nav edge-next" id="edgeNext" aria-label="下一頁"><svg class="ic"><use href="#i-next"/></svg></button>
  </div>

  <div id="readerLoading" class="reader-loading">
    <div class="spinner"></div>
    <p id="readerLoadingText">載入中…</p>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="config.js"></script>
<script src="app.js?v=10"></script>
</body>
</html>
